<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="shieldRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FF3333" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#660000" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1A0202" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Glow Shadow -->
  <path d="M100 15 L180 50 C180 145 100 215 100 215 C100 215 20 145 20 50 Z" 
        fill="none" stroke="#F5A623" stroke-width="4" filter="url(#goldGlow)" opacity="0.6"/>

  <!-- Main Shield Outer Border -->
  <path d="M100 18 L176 52 C176 142 100 210 100 210 C100 210 24 142 24 52 Z" 
        fill="url(#innerGlow)" stroke="url(#shieldGold)" stroke-width="5"/>

  <!-- Inner Shield Trim Line -->
  <path d="M100 28 L166 58 C166 136 100 198 100 198 C100 198 34 136 34 58 Z" 
        fill="none" stroke="#FF4D4D" stroke-width="1.8" opacity="0.85"/>

  <!-- Glowing Fingerprint Graphic -->
  <g transform="translate(100, 115) scale(0.9)" stroke="#FFD166" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)">
    <!-- Arch 1 (Center) -->
    <path d="M-5 12 C -5 -5, 5 -5, 5 12"/>
    <path d="M0 16 L0 4"/>
    <!-- Arch 2 -->
    <path d="M-13 18 C -13 -12, 13 -12, 13 18"/>
    <!-- Arch 3 -->
    <path d="M-21 22 C -21 -20, 21 -20, 21 22"/>
    <path d="M-21 32 C -21 27, -21 25, -21 22"/>
    <!-- Arch 4 -->
    <path d="M-29 25 C -29 -28, 29 -28, 29 25"/>
    <path d="M29 25 C 29 35, 27 40, 25 45"/>
    <!-- Arch 5 -->
    <path d="M-37 28 C -37 -36, 37 -36, 37 28"/>
    <path d="M-37 28 C -37 40, -32 48, -25 54"/>
    <!-- Outer accent rings -->
    <path d="M-44 20 C -44 -42, 44 -42, 44 20"/>
  </g>
</svg>
