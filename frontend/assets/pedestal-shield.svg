<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <!-- Gold gradient -->
    <linearGradient id="pedestalGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#FFA500"/>
      <stop offset="50%" stop-color="#FFE066"/>
      <stop offset="75%" stop-color="#D49A24"/>
      <stop offset="100%" stop-color="#7A5200" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonStage" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing Pedestal Stage Rings -->
  <g transform="translate(160, 240)">
    <!-- Base large glow -->
    <ellipse cx="0" cy="0" rx="140" ry="40" fill="url(#ringGlow)" filter="url(#neonStage)"/>
    <!-- Bottom Tier Rim -->
    <ellipse cx="0" cy="0" rx="130" ry="34" fill="#1C1408" stroke="url(#pedestalGold)" stroke-width="3"/>
    <ellipse cx="0" cy="-4" rx="122" ry="30" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.8"/>

    <!-- Middle Tier -->
    <ellipse cx="0" cy="-14" rx="100" ry="26" fill="#150E04" stroke="#FFA500" stroke-width="2.5"/>
    <ellipse cx="0" cy="-18" rx="90" ry="22" fill="none" stroke="#FFE066" stroke-width="1.2" opacity="0.9"/>

    <!-- Top Platform Surface -->
    <ellipse cx="0" cy="-28" rx="72" ry="18" fill="#2E1C05" stroke="#FFE066" stroke-width="3"/>
    <ellipse cx="0" cy="-28" rx="60" ry="14" fill="#FFC107" fill-opacity="0.25" filter="url(#neonStage)"/>

    <!-- Light Beams Rising Up -->
    <path d="M-50 -30 L-25 -150 L25 -150 L50 -30 Z" fill="url(#pedestalGold)" opacity="0.15"/>
  </g>

  <!-- Holographic Shield on top of Pedestal -->
  <g transform="translate(160, 110)">
    <!-- Outer Shield -->
    <path d="M0 -70 L55 -40 C55 35 0 85 0 85 C0 85 -55 35 -55 -40 Z" 
          fill="#3B050B" fill-opacity="0.8" stroke="#FFE066" stroke-width="3.5" filter="url(#neonStage)"/>
    <!-- Inner Accent -->
    <path d="M0 -60 L45 -34 C45 28 0 70 0 70 C0 70 -45 28 -45 -34 Z" 
          fill="none" stroke="#FF4D4D" stroke-width="1.5" opacity="0.85"/>

    <!-- Center Glowing Fingerprint inside Hologram -->
    <g transform="translate(0, 10) scale(0.65)" stroke="#FFD166" stroke-width="3.2" stroke-linecap="round" fill="none">
      <path d="M-6 12 C -6 -6, 6 -6, 6 12"/>
      <path d="M0 16 L0 4"/>
      <path d="M-15 18 C -15 -14, 15 -14, 15 18"/>
      <path d="M-24 22 C -24 -22, 24 -22, 24 22"/>
      <path d="M-33 26 C -33 -30, 33 -30, 33 26"/>
      <path d="M-42 24 C -42 -38, 42 -38, 42 24"/>
    </g>
  </g>
</svg>
