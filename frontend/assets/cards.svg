<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" fill="none">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="goldCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D281E"/>
      <stop offset="40%" stop-color="#1A1813"/>
      <stop offset="100%" stop-color="#0F0E0B"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="50%" stop-color="#D49A24"/>
      <stop offset="100%" stop-color="#7A5200"/>
    </linearGradient>
    <linearGradient id="redCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#400A0A"/>
      <stop offset="40%" stop-color="#200505"/>
      <stop offset="100%" stop-color="#120202"/>
    </linearGradient>
    <linearGradient id="redBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="50%" stop-color="#C62828"/>
      <stop offset="100%" stop-color="#4A0505"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- BACKGROUND CREDIT CARD (GOLD/DARK) -->
  <g transform="translate(40, 20) rotate(-6)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="300" height="185" rx="14" fill="url(#goldCardGrad)" stroke="url(#goldBorder)" stroke-width="2"/>
    <!-- Subtle gold circuit pattern -->
    <path d="M0 60 Q 150 40 300 90" stroke="#E5A93C" stroke-width="0.8" opacity="0.3" fill="none"/>
    <path d="M0 120 Q 120 150 300 130" stroke="#E5A93C" stroke-width="0.6" opacity="0.25" fill="none"/>
    <!-- Chip -->
    <rect x="25" y="45" width="40" height="30" rx="6" fill="url(#chipGrad)" stroke="#805B00" stroke-width="1"/>
    <path d="M45 45 L45 75 M25 60 L65 60" stroke="#7A5200" stroke-width="1"/>
    <!-- Contactless icon -->
    <path d="M80 50 A 15 15 0 0 1 80 70 M85 45 A 22 22 0 0 1 85 75" stroke="#FFE885" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- Card Type Label -->
    <text x="210" y="40" fill="#E8B949" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" letter-spacing="1.5">CREDIT CARD</text>
    <!-- Embossed Number -->
    <text x="25" y="115" fill="#FFE885" font-family="'Courier New', monospace" font-weight="bold" font-size="16" letter-spacing="3" opacity="0.95">5321 7700 0000 1234</text>
    <!-- Expiry -->
    <text x="25" y="145" fill="#A08E66" font-family="monospace" font-size="8">VALID THRU</text>
    <text x="80" y="145" fill="#FFE885" font-family="monospace" font-weight="bold" font-size="11">12/29</text>
    <!-- Mastercard Circles -->
    <circle cx="250" cy="140" r="15" fill="#FF5252" opacity="0.8"/>
    <circle cx="270" cy="140" r="15" fill="#FFB74D" opacity="0.8"/>
  </g>

  <!-- FOREGROUND DEBIT CARD (RED ACCENT) -->
  <g transform="translate(110, 85)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="310" height="190" rx="14" fill="url(#redCardGrad)" stroke="url(#redBorder)" stroke-width="2"/>
    <!-- Glowing red curve -->
    <path d="M0 80 C 90 40, 200 130, 310 90" stroke="#FF4D4D" stroke-width="1.2" opacity="0.5" fill="none"/>
    <!-- Chip -->
    <rect x="25" y="48" width="42" height="32" rx="6" fill="url(#chipGrad)" stroke="#805B00" stroke-width="1"/>
    <path d="M46 48 L46 80 M25 64 L67 64" stroke="#7A5200" stroke-width="1"/>
    <!-- Contactless icon -->
    <path d="M82 54 A 15 15 0 0 1 82 74 M88 49 A 22 22 0 0 1 88 79" stroke="#FF9999" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9"/>
    <!-- Label -->
    <text x="220" y="42" fill="#FF8A80" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" letter-spacing="1.5">DEBIT CARD</text>
    <!-- Card Number -->
    <text x="25" y="122" fill="#FFFFFF" font-family="'Courier New', monospace" font-weight="bold" font-size="17" letter-spacing="3.2" opacity="0.95">5321 7700 0000 1234</text>
    <!-- Expiry -->
    <text x="25" y="152" fill="#D32F2F" font-family="monospace" font-size="9">VALID THRU</text>
    <text x="85" y="152" fill="#FFFFFF" font-family="monospace" font-weight="bold" font-size="12">12/29</text>
    <!-- Card Logo Circles -->
    <circle cx="260" cy="148" r="16" fill="#FF3D00" opacity="0.85"/>
    <circle cx="282" cy="148" r="16" fill="#FFC107" opacity="0.85"/>
  </g>
</svg>
