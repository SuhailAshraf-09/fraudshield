name: fraudshield-phase12

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: fraudshield_phase12
      POSTGRES_USER: fraudshield_test
      POSTGRES_PASSWORD: ${PHASE12_POSTGRES_PASSWORD:?Missing test password}
    volumes:
      - phase12_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudshield_test -d fraudshield_phase12"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: fraudshield-ai-backend:phase11
    environment:
      FRAUDSHIELD_DATABASE_URL: postgresql+psycopg://fraudshield_test:${PHASE12_POSTGRES_PASSWORD}@db:5432/fraudshield_phase12
      JWT_SECRET: ${PHASE12_JWT_SECRET:?Missing JWT secret}
      CORS_ORIGINS: http://127.0.0.1:5500,http://localhost:5500
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

volumes:
  phase12_db:
